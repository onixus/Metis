        feature_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        dev_cost: { $ref: "#/components/schemas/Money" }
        confirmation_cost: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }

    # ---- discovery ----
