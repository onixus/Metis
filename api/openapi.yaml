        summary:
          type: string
        status:
          type: string
        done:
          type: boolean
        created_at:
          type: string
          format: date-time
      x-go-type: delivery.IssueSnapshot
      x-go-type-import:
        path: github.com/onixus/metis/internal/delivery
    DeliverySprint:
