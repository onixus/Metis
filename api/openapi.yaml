        base_release_id: { type: string, format: uuid, description: "Релиз, от которого ответвлена сертифицированная ветка; пусто при обновлении — не менять" }
        eol: { type: string, format: date, description: "Дата окончания поддержки (RM-05); пусто при обновлении — не менять" }
