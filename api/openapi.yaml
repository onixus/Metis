openapi: 3.0.3
info:
  title: Метида — API платформы управления продуктовым портфелем
  version: 0.1.0
  description: |
    Источник правды для серверных интерфейсов и клиента (NF-M04).
    Авторизация: Bearer-токен OIDC. Все ответы об ошибках — application/problem+json.
    Аудитория roadmap и уровень доступа к продукту берутся из области доступа субъекта, а не из параметров.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: system
  - name: portfolio
  - name: features
  - name: links
  - name: contracts
  - name: signals
  - name: prioritization
  - name: roadmap
  - name: delivery
  - name: discovery
  - name: commitments
  - name: compliance
  - name: decisions
  - name: admin
  - name: economics
paths:
  /me:
    get:
      tags: [system]
      operationId: getMe
      summary: Область доступа текущего субъекта
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Problem" }

  /products:
    get:
      tags: [portfolio]
      operationId: listProducts
      summary: Продукты, видимые субъекту
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [portfolio]
      operationId: createProduct
      summary: Создать продукт (PG-01)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        default: { $ref: "#/components/responses/Problem" }
  /products/{productId}:
    parameters:
      - $ref: "#/components/parameters/productId"
    get:
      tags: [portfolio]
      operationId: getProduct
      summary: Продукт
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [portfolio]
      operationId: updateProduct
      summary: Изменить продукт
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [portfolio]
      operationId: deleteProduct
      summary: Удалить продукт с его фичами и связями; продукт с контрактами не удаляется (409)
      responses:
        "204": { description: Удалено }
        "409":
          description: Продукт участвует в контрактах
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /products/{productId}/strategic:
    parameters:
      - $ref: "#/components/parameters/productId"
    get:
      tags: [portfolio]
      operationId: getStrategicSlice
      summary: Стратегический срез продукта (PG-10)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategicSlice" }
        default: { $ref: "#/components/responses/Problem" }
  /products/{productId}/capabilities:
    parameters:
      - $ref: "#/components/parameters/productId"
    post:
      tags: [features]
      operationId: createCapability
      summary: Создать возможность (PG-02)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capability" }
        default: { $ref: "#/components/responses/Problem" }
  /products/{productId}/features:
    parameters:
      - $ref: "#/components/parameters/productId"
    get:
      tags: [features]
      operationId: listFeatures
      summary: Фичи продукта (приватный контур)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Feature" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [features]
      operationId: createFeature
      summary: Создать фичу (PG-02)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeatureInput" }
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feature" }
        default: { $ref: "#/components/responses/Problem" }
  /products/{productId}/feature-values:
    parameters:
      - $ref: "#/components/parameters/productId"
    get:
      tags: [features]
      operationId: listFeatureValues
      summary: Rollup производного спроса по продукту (PG-07)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FeatureValue" }
        default: { $ref: "#/components/responses/Problem" }
  /features/{featureId}:
    parameters:
      - $ref: "#/components/parameters/featureId"
    get:
      tags: [features]
      operationId: getFeature
      summary: Фича
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feature" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      tags: [features]
      operationId: updateFeature
      summary: Изменить фичу (дата — через shift-date)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeatureInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feature" }
        default: { $ref: "#/components/responses/Problem" }
  /features/{featureId}/requirements:
    parameters:
      - $ref: "#/components/parameters/featureId"
    post:
      tags: [features]
      operationId: createRequirement
      summary: Добавить требование (PG-02)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Requirement" }
        default: { $ref: "#/components/responses/Problem" }
  /features/{featureId}/shift-date:
    parameters:
      - $ref: "#/components/parameters/featureId"
    post:
      tags: [features]
      operationId: shiftFeatureDate
      summary: Изменить плановую дату с причиной и распространить сдвиг (PG-08, RM-03)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planned_date, reason]
              properties:
                planned_date: { type: string, format: date }
                reason: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShiftResult" }
        default: { $ref: "#/components/responses/Problem" }
  /features/{featureId}/value:
    parameters:
      - $ref: "#/components/parameters/featureId"
    get:
      tags: [features]
      operationId: getFeatureValue
      summary: Rollup одной фичи (PG-07)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureValue" }
        default: { $ref: "#/components/responses/Problem" }

  /links:
    get:
      tags: [links]
      operationId: listLinks
      summary: Связи, видимые субъекту (PG-03, PG-09)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Link" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [links]
      operationId: createLink
      summary: Создать связь; при цикле — 409 с путём (PG-05)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkInput" }
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Link" }
        "409":
          description: Цикл в графе зависимостей фич
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/CycleProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /links/{linkId}:
    parameters:
      - name: linkId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [links]
      operationId: deleteLink
      summary: Удалить связь
      responses:
        "204": { description: Удалено }
        default: { $ref: "#/components/responses/Problem" }
  /hubs:
    get:
      tags: [links]
      operationId: listHubs
      summary: Роль хаба по входящей связности (PG-06)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HubInfo" }
        default: { $ref: "#/components/responses/Problem" }

  /contracts:
    get:
      tags: [contracts]
      operationId: listContracts
      summary: Интеграционные контракты (PG-04)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Contract" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [contracts]
      operationId: createContract
      summary: Создать контракт
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContractInput" }
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "409":
          description: Цикл в графе зависимостей фич
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/CycleProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /contracts/{contractId}:
    parameters:
      - name: contractId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [contracts]
      operationId: getContract
      summary: Контракт со сроком готовности
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [contracts]
      operationId: updateContract
      summary: Изменить контракт
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContractInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        default: { $ref: "#/components/responses/Problem" }

  /admin/settings/graph:
    get:
      tags: [admin]
      operationId: getGraphSettings
      summary: Коэффициенты критичности (PG-07)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphSettings" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [admin]
      operationId: updateGraphSettings
      summary: Изменить коэффициенты
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GraphSettings" }
      responses:
        "204": { description: OK }
        default: { $ref: "#/components/responses/Problem" }
  /admin/audit/verify:
    post:
      tags: [admin]
      operationId: verifyAudit
      summary: Проверка целостности журнала аудита (NF-S05)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditVerifyResult" }
        default: { $ref: "#/components/responses/Problem" }

  /products/{productId}/signals:
    parameters:
      - $ref: "#/components/parameters/productId"
    get:
      tags: [signals]
      operationId: listSignals
      summary: Сигналы продукта (приватный контур)
      parameters:
        - name: status
          in: query
          schema:
            type: array
            items: { type: string, enum: [new, in_review, linked, rejected, merged] }
        - name: feature_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Signal" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [signals]
      operationId: ingestSignal
      summary: Принять сигнал вручную (SG-01)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignalInput" }
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Signal" }
        default: { $ref: "#/components/responses/Problem" }
  /products/{productId}/signals/triage:
    parameters:
      - $ref: "#/components/parameters/productId"
    get:
      tags: [signals]
      operationId: triageQueue
      summary: Очередь разбора по сроку (SG-03)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Signal" }
        default: { $ref: "#/components/responses/Problem" }
  /signals/import/crm:
    post:
      tags: [signals]
      operationId: importSignalsFromCRM
      summary: Импорт сигналов из порта CRM (SG-01)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        default: { $ref: "#/components/responses/Problem" }
  /signals/{signalId}:
    parameters:
      - $ref: "#/components/parameters/signalId"
    get:
      tags: [signals]
      operationId: getSignal
      summary: Сигнал
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Signal" }
        default: { $ref: "#/components/responses/Problem" }
  /signals/{signalId}/triage:
    parameters:
      - $ref: "#/components/parameters/signalId"
    post:
      tags: [signals]
      operationId: triageSignal
      summary: Изменить статус и срок разбора (SG-03)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [new, in_review, rejected] }
                due_date: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Signal" }
        default: { $ref: "#/components/responses/Problem" }
  /signals/{signalId}/link:
    parameters:
      - $ref: "#/components/parameters/signalId"
    post:
      tags: [signals]
      operationId: linkSignal
      summary: Привязать к фиче, контракту или гипотезе с сохранением денежного веса (SG-05, DS-01)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                feature_id: { type: string, format: uuid }
                contract_id: { type: string, format: uuid }
                hypothesis_id: { type: string, format: uuid, description: Гипотеза discovery (DS-01) }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Signal" }
        default: { $ref: "#/components/responses/Problem" }

  /scoring-models:
    get:
      tags: [prioritization]
      operationId: listScoringModels
      summary: Модели оценки (PR-01)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScoringModel" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [prioritization]
      operationId: createScoringModel
      summary: Создать модель оценки
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScoringModelInput" }
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScoringModel" }
        default: { $ref: "#/components/responses/Problem" }
  /scoring-models/{modelId}:
    parameters:
      - $ref: "#/components/parameters/modelId"
    put:
      tags: [prioritization]
      operationId: updateScoringModel
      summary: Изменить модель
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScoringModelInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScoringModel" }
        default: { $ref: "#/components/responses/Problem" }
  /scoring-models/{modelId}/features/{featureId}/inputs:
    parameters:
      - $ref: "#/components/parameters/modelId"
      - $ref: "#/components/parameters/featureId"
    put:
      tags: [prioritization]
      operationId: setFeatureScoreInputs
      summary: Задать входные переменные фичи
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties: { type: string, description: Десятичное число строкой }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScoreResult" }
        default: { $ref: "#/components/responses/Problem" }
  /scoring-models/{modelId}/products/{productId}/ranking:
    parameters:
      - $ref: "#/components/parameters/modelId"
      - $ref: "#/components/parameters/productId"
    get:
      tags: [prioritization]
      operationId: getRanking
      summary: Ранжирование фич продукта по модели (PR-01…PR-03)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScoreResult" }
        default: { $ref: "#/components/responses/Problem" }

  /products/{productId}/roadmap/items:
    parameters:
      - $ref: "#/components/parameters/productId"
    get:
      tags: [roadmap]
      operationId: listRoadmapItems
      summary: Элементы roadmap (внутренняя аудитория)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RoadmapItem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [roadmap]
      operationId: createRoadmapItem
      summary: Создать элемент roadmap
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoadmapItemInput" }
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoadmapItem" }
        default: { $ref: "#/components/responses/Problem" }
  /products/{productId}/roadmap/timeline:
    parameters:
      - $ref: "#/components/parameters/productId"
    get:
      tags: [roadmap]
      operationId: getRoadmapTimeline
      summary: Timeline (RM-01); срез по аудитории субъекта (RM-02)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoadmapTimeline" }
        default: { $ref: "#/components/responses/Problem" }
  /products/{productId}/roadmap/now-next-later:
    parameters:
      - $ref: "#/components/parameters/productId"
    get:
      tags: [roadmap]
      operationId: getRoadmapNowNextLater
      summary: Now/Next/Later (RM-01)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoadmapNowNextLater" }
        default: { $ref: "#/components/responses/Problem" }
  /products/{productId}/roadmap/by-release:
    parameters:
      - $ref: "#/components/parameters/productId"
    get:
      tags: [roadmap]
      operationId: getRoadmapByRelease
      summary: По релизам (RM-01)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoadmapByRelease" }
        default: { $ref: "#/components/responses/Problem" }
  /products/{productId}/releases:
    parameters:
      - $ref: "#/components/parameters/productId"
    get:
      tags: [roadmap]
      operationId: listReleases
      summary: Релизы продукта
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Release" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [roadmap]
      operationId: createRelease
      summary: Создать релиз
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseInput" }
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Release" }
        default: { $ref: "#/components/responses/Problem" }
  /roadmap/items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/itemId"
    patch:
      tags: [roadmap]
      operationId: updateRoadmapItem
      summary: Изменить элемент (даты — через change-dates)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoadmapItemInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoadmapItem" }
        default: { $ref: "#/components/responses/Problem" }
  /roadmap/items/{itemId}/change-dates:
    parameters:
      - $ref: "#/components/parameters/itemId"
    post:
      tags: [roadmap]
      operationId: changeRoadmapItemDates
      summary: Изменить даты с обязательной причиной (RM-03)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
