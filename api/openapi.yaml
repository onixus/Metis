        - $ref: '#/components/parameters/productId'
        - name: period
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EconomicsVersionInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EconomicsSnapshot'
        default:
          $ref: '#/components/responses/Problem'
  /products/{productId}/economics/{period}/report:
    get:
      tags:
        - economics
      operationId: getEconomicsReport
      summary: P&L, команда × продукт, инвестиции и lineage (EC-03/05/06/12)
      parameters:
        - $ref: '#/components/parameters/productId'
        - name: period
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
        - name: version
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: filter_product_id
          in: query
          schema:
            type: string
            format: uuid
        - name: team
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EconomicsReport'
        default:
          $ref: '#/components/responses/Problem'
  /products/{productId}/economics/{period}/scenario:
    post:
      tags:
        - economics
      operationId: calculateEconomicsScenario
      summary: Сценарий без изменения фактов (EC-13)
      parameters:
        - $ref: '#/components/parameters/productId'
        - name: period
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EconomicsScenario'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EconomicsReport'
        default:
          $ref: '#/components/responses/Problem'
  /products/{productId}/economics/{period}/export:
    get:
      tags:
        - economics
      operationId: exportEconomics
      summary: Аудируемый CSV P&L (NF-S02/14)
      parameters:
        - $ref: '#/components/parameters/productId'
        - name: period
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
        - name: version
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: filter_product_id
          in: query
          schema:
            type: string
            format: uuid
        - name: team
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            text/csv:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Problem'

  /products/{productId}/finance-templates:
    parameters:
      - $ref: '#/components/parameters/productId'
    get:
      tags:
        - economics
      operationId: listFinanceTemplates
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EconomicsImportTemplate'
        default:
          $ref: '#/components/responses/Problem'
    put:
      tags:
        - economics
      operationId: saveFinanceTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EconomicsImportTemplate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EconomicsImportTemplate'
        default:
          $ref: '#/components/responses/Problem'

  /products/{productId}/economics/{period}/worklog-shares:
    parameters:
      - $ref: '#/components/parameters/productId'
      - name: period
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
    post:
      tags:
        - economics
      operationId: applyFinanceWorklogs
      summary: Распределить затраты по Jira worklogs и явному соответствию авторов командам (DL-05/EC-12)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EconomicsWorklogInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EconomicsSnapshot'
        default:
          $ref: '#/components/responses/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    productId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    featureId:
      name: featureId
      in: path
      required: true
      schema: { type: string, format: uuid }
    signalId:
      name: signalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    modelId:
      name: modelId
      in: path
      required: true
      schema: { type: string, format: uuid }
    itemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    releaseId:
      name: releaseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    hypothesisId:
      name: hypothesisId
      in: path
      required: true
      schema: { type: string, format: uuid }
    interviewId:
      name: interviewId
      in: path
      required: true
      schema: { type: string, format: uuid }
    insightId:
      name: insightId
      in: path
      required: true
      schema: { type: string, format: uuid }
    evidenceId:
      name: evidenceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    commitmentId:
      name: commitmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    alertId:
      name: alertId
      in: path
      required: true
      schema: { type: string, format: uuid }
    setId:
      name: setId
      in: path
      required: true
      schema: { type: string, format: uuid }
    trackId:
      name: trackId
      in: path
      required: true
      schema: { type: string, format: uuid }
    gateId:
      name: gateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    decisionId:
      name: decisionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    entity:
      name: entity
      in: query
      required: true
      schema: { type: string, enum: [feature, signal, hypothesis] }
  responses:
    Problem:
      description: Ошибка
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        field: { type: string }
    CycleProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [cycle]
          properties:
            cycle:
              type: array
              items: { type: string, format: uuid }
              description: Путь цикла f1 → f2 → … → f1
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, format: int64, description: Минорные единицы }
        currency: { type: string }
    Me:
      type: object
      required: [subject, roles, audience, all_products, products, finance]
      properties:
        finance: { type: string, enum: [none, aggregates, full] }
        subject: { type: string }
        roles:
          type: array
          items: { type: string }
        audience: { type: string, enum: [internal, sales_safe] }
        all_products: { type: string, enum: [none, strategic, private] }
        products:
          type: object
          additionalProperties: { type: string, enum: [none, strategic, private] }
    ProductInput:
      type: object
      required: [key, name, type]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string, maxLength: 12000, description: Назначение, границы и источники; обычный текст. Отсутствие поля сохраняет описание при обновлении. }
        type: { type: string, enum: [security, infrastructure, platform, other] }
        owner: { type: string }
        lifecycle: { type: string, enum: [idea, active, sunset, retired] }
        ssdlc_certified: { type: boolean }
        hub_manual: { type: boolean }
    Product:
      allOf:
        - $ref: "#/components/schemas/ProductInput"
        - type: object
          required: [id, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    Capability:
      type: object
      required: [id, product_id, name]
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        name: { type: string }
    FeatureInput:
      type: object
      properties:
        capability_id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [idea, discovery, planned, in_progress, done, rejected] }
        planned_date: { type: string, format: date }
        external_key: { type: string }
    Feature:
      type: object
      required: [id, product_id, name, status, own_value, affected]
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        capability_id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [idea, discovery, planned, in_progress, done, rejected] }
        own_value: { $ref: "#/components/schemas/Money" }
        planned_date: { type: string, format: date, nullable: true }
        affected: { type: boolean }
        affected_by: { type: string, format: uuid }
        implied_date: { type: string, format: date, nullable: true }
        external_key: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Requirement:
      type: object
      required: [id, product_id, feature_id, text]
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        feature_id: { type: string, format: uuid }
        text: { type: string }
    FeatureValue:
      type: object
      required: [feature_id, product_id, own_value, derived_value, total_value, computed_at]
      properties:
        feature_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        own_value: { $ref: "#/components/schemas/Money" }
        derived_value: { $ref: "#/components/schemas/Money" }
        total_value: { $ref: "#/components/schemas/Money" }
        computed_at: { type: string, format: date-time }
    LinkInput:
      type: object
      required: [type, criticality]
      properties:
        type: { type: string, enum: [integration, shared_component, commercial, bundled] }
        from_product_id: { type: string, format: uuid }
        to_product_id: { type: string, format: uuid }
        from_feature_id: { type: string, format: uuid }
        to_feature_id: { type: string, format: uuid }
        criticality: { type: string, enum: [blocks, accelerates, desirable] }
        contract_id: { type: string, format: uuid }
    Link:
      allOf:
        - $ref: "#/components/schemas/LinkInput"
        - type: object
          required: [id, from_product_id, to_product_id, created_at]
          properties:
            id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
    HubInfo:
      type: object
      required: [product_id, in_degree, manual, computed]
      properties:
        product_id: { type: string, format: uuid }
        in_degree: { type: integer }
        manual: { type: boolean }
        computed: { type: boolean }
    VersionPair:
      type: object
      required: [provider_version, consumer_version, compatible]
      properties:
        provider_version: { type: string }
        consumer_version: { type: string }
        compatible: { type: boolean }
    ContractInput:
      type: object
      required: [name, provider_product_id, consumer_product_id, criticality]
      properties:
        name: { type: string }
        provider_product_id: { type: string, format: uuid }
        consumer_product_id: { type: string, format: uuid }
        provider_feature_ids:
          type: array
          items: { type: string, format: uuid }
        consumer_feature_ids:
          type: array
          items: { type: string, format: uuid }
        interface_version: { type: string }
        owner: { type: string }
        status: { type: string, enum: [draft, active, deprecated] }
        criticality: { type: string, enum: [blocks, accelerates, desirable] }
        compatibility:
          type: array
          items: { $ref: "#/components/schemas/VersionPair" }
    Contract:
      allOf:
        - $ref: "#/components/schemas/ContractInput"
        - type: object
          required: [id, signal_value, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            signal_value: { $ref: "#/components/schemas/Money" }
            ready_date: { type: string, format: date, nullable: true }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    AffectedFeature:
      type: object
      required: [feature_id, product_id, via_feature, depth]
      properties:
        feature_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        planned_date: { type: string, format: date, nullable: true }
        implied_date: { type: string, format: date, nullable: true }
        via_feature: { type: string, format: uuid }
        depth: { type: integer }
    ShiftResult:
      type: object
      required: [source_feature, new_date, affected, contracts, commitments]
      properties:
        source_feature: { type: string, format: uuid }
        old_date: { type: string, format: date, nullable: true }
        new_date: { type: string, format: date }
        affected:
          type: array
          items: { $ref: "#/components/schemas/AffectedFeature" }
        contracts:
          type: array
          items: { type: string, format: uuid }
        commitments:
          type: array
          items: { type: string, format: uuid }
    StrategicFeature:
      type: object
      required: [id, name, status, total_value, affected]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string }
        total_value: { $ref: "#/components/schemas/Money" }
        planned_date: { type: string, format: date, nullable: true }
        affected: { type: boolean }
    StrategicSlice:
      type: object
      required: [product, features, contracts]
      properties:
        product: { $ref: "#/components/schemas/Product" }
        features:
          type: array
          items: { $ref: "#/components/schemas/StrategicFeature" }
        contracts:
          type: array
          items: { $ref: "#/components/schemas/Contract" }
    GraphSettings:
      type: object
      required: [coefficients]
      properties:
        coefficients:
          type: object
          description: Коэффициенты критичности как десятичные строки
          additionalProperties: { type: string }
    AuditVerifyResult:
      type: object
      required: [checked, ok]
      properties:
        checked: { type: integer, format: int64 }
        ok: { type: boolean }
        broken_seq: { type: integer, format: int64 }
        reason: { type: string }

    SignalInput:
      type: object
      required: [source, text]
      properties:
        source: { type: string, enum: [crm, service_desk, manual, import] }
        text: { type: string }
        external_key: { type: string }
        account_id: { type: string }
        deal_id: { type: string }
        version: { type: string }
        segment: { type: string }
        deal_amount: { $ref: "#/components/schemas/Money" }
        account_arr: { $ref: "#/components/schemas/Money" }
        blocks_deal: { type: boolean }
    Signal:
      type: object
      required: [id, product_id, source, text, weight, account_arr, blocks_deal, status, created_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        source: { type: string, enum: [crm, service_desk, manual, import] }
        text: { type: string }
        external_key: { type: string }
        account_id: { type: string }
        deal_id: { type: string }
        version: { type: string }
        segment: { type: string }
        weight: { $ref: "#/components/schemas/Money" }
        account_arr: { $ref: "#/components/schemas/Money" }
        blocks_deal: { type: boolean }
        status: { type: string, enum: [new, in_review, linked, rejected, merged] }
        due_date: { type: string, format: date, nullable: true }
        feature_id: { type: string, format: uuid }
        contract_id: { type: string, format: uuid }
        hypothesis_id: { type: string, format: uuid }
        merged_into: { type: string, format: uuid, description: Сигнал, в который слит дубликат (SG-04) }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ImportResult:
      type: object
      required: [imported, skipped]
      properties:
        imported: { type: integer }
        skipped:
          type: object
          additionalProperties: { type: string }
    ScoringModelInput:
      type: object
      required: [name, type]
      properties:
        product_id: { type: string, format: uuid, description: Пусто — портфельная модель }
        name: { type: string }
        type: { type: string, enum: [rice, wsjf, custom] }
        formula: { type: string }
        inputs:
          type: array
          items: { type: string }
    ScoringModel:
      type: object
      required: [id, name, type, formula, inputs, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [rice, wsjf, custom] }
        formula: { type: string }
        inputs:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ScoreComponent:
      type: object
      required: [name, value, system]
      properties:
        name: { type: string }
        value: { type: string }
        system: { type: boolean }
    ScoreResult:
      type: object
      required: [model_id, feature_id, product_id, score, components, explanation]
      properties:
        model_id: { type: string, format: uuid }
        feature_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        score: { type: string, description: Десятичное число строкой }
        components:
          type: array
          items: { $ref: "#/components/schemas/ScoreComponent" }
        explanation: { type: string }
    RoadmapItemInput:
      type: object
      properties:
        feature_id: { type: string, format: uuid }
        title: { type: string }
        bucket: { type: string, enum: [now, next, later] }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        release_id: { type: string, format: uuid }
        audience: { type: string, enum: [internal, sales_safe] }
        status: { type: string, enum: [planned, in_progress, done, cancelled] }
        kind: { type: string, enum: [feature, fix], description: Вид элемента (RM-04); по умолчанию feature }
    RoadmapItem:
      type: object
      required: [id, product_id, title, bucket, audience, status, kind, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        feature_id: { type: string, format: uuid }
        title: { type: string }
        bucket: { type: string, enum: [now, next, later] }
        start_date: { type: string, format: date, nullable: true }
        end_date: { type: string, format: date, nullable: true }
        release_id: { type: string, format: uuid }
        audience: { type: string, enum: [internal, sales_safe] }
        status: { type: string, enum: [planned, in_progress, done, cancelled] }
        kind: { type: string, enum: [feature, fix] }
        commitment_id: { type: string, format: uuid, description: Обязательство, породившее элемент (CT-04) }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SalesSafeItem:
      type: object
      required: [id, product_id, title, bucket]
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        title: { type: string }
        bucket: { type: string, enum: [now, next, later] }
        start_date: { type: string, format: date, nullable: true }
        end_date: { type: string, format: date, nullable: true }
        release_id: { type: string, format: uuid }
    RoadmapGroup:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RoadmapItem" }
        sales_safe:
          type: array
          items: { $ref: "#/components/schemas/SalesSafeItem" }
    RoadmapTimeline:
      type: object
      required: [product_id, audience]
      properties:
        product_id: { type: string, format: uuid }
        audience: { type: string, enum: [internal, sales_safe] }
        items:
          type: array
          items: { $ref: "#/components/schemas/RoadmapItem" }
        sales_safe:
          type: array
          items: { $ref: "#/components/schemas/SalesSafeItem" }
    RoadmapNowNextLater:
      type: object
      required: [product_id, audience, now, next, later]
      properties:
        product_id: { type: string, format: uuid }
        audience: { type: string, enum: [internal, sales_safe] }
        now: { $ref: "#/components/schemas/RoadmapGroup" }
        next: { $ref: "#/components/schemas/RoadmapGroup" }
        later: { $ref: "#/components/schemas/RoadmapGroup" }
    ReleaseGroup:
      type: object
      required: [release]
      properties:
        release: { $ref: "#/components/schemas/Release" }
        sales_safe_release: { $ref: "#/components/schemas/SalesSafeRelease" }
        items:
          type: array
          items: { $ref: "#/components/schemas/RoadmapItem" }
        sales_safe:
          type: array
          items: { $ref: "#/components/schemas/SalesSafeItem" }
    RoadmapByRelease:
      type: object
      required: [product_id, audience, releases, unassigned]
      properties:
        product_id: { type: string, format: uuid }
        audience: { type: string, enum: [internal, sales_safe] }
        releases:
          type: array
          items: { $ref: "#/components/schemas/ReleaseGroup" }
        unassigned: { $ref: "#/components/schemas/RoadmapGroup" }
    ReleaseInput:
      type: object
      description: >-
        Данные релиза. При создании необязательные поля берут значения по умолчанию
        (status=planned, branch=evolving). При обновлении (PUT /releases/{releaseId}) опущенное
        необязательное поле означает «не менять»: status, branch, base_release_id и eol сохраняют
        текущее значение релиза. Снять дату окончания поддержки можно только через
        PUT /releases/{releaseId}/eol с пустой датой.
      required: [name, version]
      properties:
        name: { type: string }
        version: { type: string }
        planned_date: { type: string, format: date }
        status: { type: string, enum: [planned, ready_for_certification, released, eol], description: "Пусто: при создании planned, при обновлении — текущий статус" }
