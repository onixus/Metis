        eol: { type: string, format: date, nullable: true }
        compatibility_matrix:
          type: array
          items: { $ref: "#/components/schemas/CompatRow" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DateChange:
      type: object
      required: [id, item_id, product_id, reason, actor, at]
      properties:
        id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        old_start: { type: string, format: date, nullable: true }
        old_end: { type: string, format: date, nullable: true }
        new_start: { type: string, format: date, nullable: true }
        new_end: { type: string, format: date, nullable: true }
        reason: { type: string }
        actor: { type: string }
        at: { type: string, format: date-time }
        event_id: { type: string, format: uuid }

