      type: object
      required: [id, product_id, name, version, status, branch, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        name: { type: string }
        version: { type: string }
        planned_date: { type: string, format: date, nullable: true }
        status: { type: string, enum: [planned, ready_for_certification, released, eol] }
        branch: { type: string, enum: [certified, evolving] }
        base_release_id: { type: string, format: uuid }
        feature_ids:
          type: array
          items: { type: string, format: uuid }
          description: Состав релиза (RM-05); внутренняя информация
