# Стенд Метиды. Учётные данные стенда помечены metis-dev-only и не используются вне стенда.
x-runtime-environment: &runtime-environment
  METIS_STORAGE: postgres
  METIS_DATABASE_URL: postgres://metis_app:metis-dev-only@postgres:5432/metis?sslmode=disable
  METIS_MIGRATE: "false"
  # Пустое значение отключает соответствующий адаптер у API и worker одновременно.
  METIS_JIRA_BASE_URL: ${METIS_JIRA_BASE_URL-http://jira-mock:8090}
  METIS_JIRA_TOKEN: metis-dev-only
  METIS_CONFLUENCE_BASE_URL: ${METIS_CONFLUENCE_BASE_URL-http://confluence-mock:8091}
  METIS_CONFLUENCE_TOKEN: metis-dev-only
  METIS_CONFLUENCE_SPACE: METIS
  METIS_OTEL_EXPORTER: ${METIS_OTEL_EXPORTER:-none}
  METIS_DELIVERY_SYNC_INTERVAL: ${METIS_DELIVERY_SYNC_INTERVAL:-1h}
  METIS_RENEWAL_INTERVAL: ${METIS_RENEWAL_INTERVAL:-24h}
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: metis
      POSTGRES_PASSWORD: metis-dev-only
      POSTGRES_DB: metis
    ports: ["127.0.0.1:${METIS_POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metis"]
      interval: 5s
      timeout: 5s
      retries: 10
  keycloak:
    profiles: [oidc]
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: metis-dev-only
      KC_HOSTNAME: http://idp.metis.test:8080
    ports: ["127.0.0.1:8080:8080"]
    networks:
      default:
        aliases: [idp.metis.test]
    volumes:
      - ./keycloak/realm-metis.json:/opt/keycloak/data/import/realm-metis.json:ro
  jira-mock:
    image: wiremock/wiremock:3.9.1
    command: ["--global-response-templating", "--port", "8090"]
    ports: ["127.0.0.1:${METIS_JIRA_MOCK_PORT:-8090}:8090"]
    healthcheck:
      # Встроенная проверка образа смотрит на порт 8080; мок слушает 8090.
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/__admin/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ./jira-mock:/home/wiremock:ro
  confluence-mock:
    image: wiremock/wiremock:3.9.1
    command: ["--global-response-templating", "--port", "8091"]
    ports: ["127.0.0.1:${METIS_CONFLUENCE_MOCK_PORT:-8091}:8091"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8091/__admin/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ./confluence-mock:/home/wiremock:ro
  migrate:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      target: migrate
    environment:
      METIS_DATABASE_URL: postgres://metis:metis-dev-only@postgres:5432/metis?sslmode=disable
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      target: api
    environment:
      <<: *runtime-environment
      METIS_HTTP_ADDR: ":8081"
      METIS_SEED: "true"
      # Стенд: hmac-токены (см. docs/questions.md №09); для Keycloak переключите на oidc.
      METIS_AUTH_MODE: ${METIS_AUTH_MODE:-hmac}
      METIS_HMAC_SECRET: ${METIS_HMAC_SECRET:-metis-dev-only-secret-0123456789abcdef}
      METIS_HMAC_ISSUER: metis-stand
      METIS_OIDC_ISSUER: ${METIS_OIDC_ISSUER:-http://idp.metis.test:8080/realms/metis}
      METIS_OIDC_CLIENT_ID: metis-web
      METIS_WEBHOOK_TOKEN: metis-dev-only-webhook
      METIS_CRM_DIR: /fixtures/crm
    ports: ["127.0.0.1:${METIS_API_PORT:-8082}:8081"]
    volumes:
      - ../../fixtures/crm:/fixtures/crm:ro
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
  worker:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      target: worker
    environment:
      <<: *runtime-environment
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      jira-mock: { condition: service_healthy }
      confluence-mock: { condition: service_healthy }
volumes:
  pgdata:
