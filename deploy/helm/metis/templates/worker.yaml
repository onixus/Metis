apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "metis.name" . }}-worker
  labels: {{- include "metis.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/component: worker, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
        {{- include "metis.labels" . | nindent 8 }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: "{{ .Values.image.registry }}/worker:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          {{- with .Values.secrets.envFromSecrets }}
          envFrom:
            {{- range . }}
            - secretRef:
                name: {{ . | quote }}
            {{- end }}
          {{- end }}
          env:
            {{- include "metis.env" . | nindent 12 }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- if or .Values.integrationFiles.profileConfigMap .Values.integrationFiles.dataExistingClaim }}
          volumeMounts:
            {{- include "metis.integrationMounts" . | nindent 12 }}
          {{- end }}
      {{- if or .Values.integrationFiles.profileConfigMap .Values.integrationFiles.dataExistingClaim }}
      volumes:
        {{- include "metis.integrationVolumes" . | nindent 8 }}
      {{- end }}
